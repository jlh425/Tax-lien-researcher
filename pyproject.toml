[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aloha"
version = "0.1.0"
description = "Aloha — Tax lien/deed research SaaS platform"
requires-python = ">=3.12"
license = {text = "Proprietary"}
readme = "README.md"

dependencies = [
    # Web framework & server
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "qdrant-client>=1.12,<2",

    # Task queue & caching
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<6",

    # HTTP & browser automation
    "httpx>=0.27,<1",
    "playwright>=1.49,<2",

    # AI agents (pydantic-ai core; provider SDKs are optional extras below)
    "pydantic-ai>=1.0,<2",

    # Document processing & OCR
    "pymupdf>=1.25,<2",
    "docling>=2.14,<3",
    "onnxruntime>=1.19,<2",
    "opencv-python-headless>=4.10,<5",

    # Data wrangling & matching
    "pandas>=2.2,<3",
    "rapidfuzz>=3.10,<4",
    "usaddress>=0.5,<1",
    "fake-useragent>=1.5,<2",

    # Reporting
    "jinja2>=3.1,<4",
    "weasyprint>=63,<64",

    # Auth
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",

    # Billing
    "stripe>=11.3,<12",

    # Observability
    "langfuse>=4.0,<5",
    "sentry-sdk[fastapi]>=2.19,<3",

    # Scheduler
    "apscheduler>=3.10,<4",

    # Utilities
    "python-dotenv>=1.0,<2",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
# LLM provider SDKs — install the one(s) you need
anthropic = ["anthropic>=0.42,<1"]
openai = ["openai>=1.50,<2"]
groq = ["groq>=0.13,<1"]
# Ollama and OpenAI-compatible use the openai SDK under the hood
ollama = ["openai>=1.50,<2"]
all-llm = ["anthropic>=0.42,<1", "openai>=1.50,<2", "groq>=0.13,<1"]
# Legacy OCR backend (system tesseract-ocr required)
tesseract = ["pytesseract>=0.3,<1"]

dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "factory-boy>=3.3,<4",
    "respx>=0.22,<1",
    "pre-commit>=4.0,<5",
]

# ---------------------------------------------------------------------------
# Hatch – src layout
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/aloha"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["aloha"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
